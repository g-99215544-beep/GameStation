<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Station Matematik</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="tangram/engine.js"></script>
<script src="tangram/shapes.js"></script>
<script src="tangram/ui.js"></script>
<style>
  :root{--navy:#1e2a4a;--gold:#d4a94e;--cream:#faf6ee;--green:#3a7d5c;--red:#c0453a;}
  *{box-sizing:border-box;}
  body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--cream);margin:0;padding:0;color:var(--navy);min-height:100vh;}
  .view{display:none;}
  .view.active{display:block;}
  .topbar{background:var(--navy);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;}
  .topbar h1{margin:0;font-size:18px;color:var(--gold);}
  #timer{font-size:22px;font-weight:800;background:#fff2;padding:4px 14px;border-radius:10px;}
  #timer.warn{color:#ffb3b3;animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:.4;}}
  .wrap{max-width:640px;margin:0 auto;padding:20px;}
  .card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:16px;}
  select,input,textarea{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;font-size:16px;margin-top:6px;}
  label{font-weight:700;font-size:14px;color:#555;display:block;margin-top:10px;}
  button{background:var(--navy);color:#fff;border:none;padding:12px 20px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;margin-top:14px;margin-right:8px;}
  button:hover{background:var(--gold);color:var(--navy);}
  button.secondary{background:var(--green);}
  button.big{width:100%;font-size:18px;padding:16px;}
  .msg{padding:12px;border-radius:10px;margin-top:12px;font-weight:600;}
  .err{background:#fbe4e2;color:var(--red);}
  .ok{background:#dff5e5;color:var(--green);}
  .role-btn{display:block;width:100%;padding:20px;font-size:18px;margin-bottom:10px;background:#fff;color:var(--navy);border:3px solid var(--navy);}
  .role-btn:hover{background:var(--navy);color:#fff;}
  .clue{background:var(--navy);color:var(--gold);padding:18px;border-radius:12px;font-size:19px;font-weight:700;margin-top:12px;text-align:center;}
  #reader{width:100%;border-radius:14px;overflow:hidden;border:4px solid var(--gold);margin-top:10px;}
  .keyrow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0;}
  .key{width:46px;height:46px;border-radius:10px;background:var(--gold);color:var(--navy);font-size:20px;display:flex;align-items:center;justify-content:center;font-weight:800;}
  .key.empty{background:#eee;color:#bbb;}
  .qitem{border:2px solid #eee;border-radius:10px;padding:14px;margin-bottom:10px;}
  .chip{display:inline-block;background:var(--gold);color:var(--navy);font-weight:800;padding:10px 16px;border-radius:8px;margin:4px;cursor:pointer;font-size:18px;}
  .match-btn{display:block;width:100%;text-align:left;background:#f5f2e8;border:2px solid #ddd;margin-top:6px;color:var(--navy);}
  .match-btn.selected{border-color:var(--gold);background:#fdf3d8;}
  .match-btn.matched{border-color:var(--green);background:#e4f7ea;opacity:.6;pointer-events:none;}
  .grid3{display:grid;gap:8px;justify-content:center;margin:16px 0;}
  .grid3 input{text-align:center;font-size:18px;padding:8px;}
  .finalbox{text-align:center;padding:20px;}
  .chest{font-size:80px;margin:20px 0;cursor:pointer;transition:transform .2s;}
  .chest:hover{transform:scale(1.1);}
  .station-block{border:2px solid #eee;border-radius:10px;padding:14px;margin-bottom:12px;}
  .station-block h3{margin:0 0 8px;color:var(--gold);background:var(--navy);display:inline-block;padding:4px 12px;border-radius:6px;}
  table{width:100%;border-collapse:collapse;margin-top:10px;}
  th,td{padding:8px;text-align:left;border-bottom:1px solid #eee;font-size:13px;}
  th{background:var(--gold);}
  .badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge.done{background:#dff5e5;color:var(--green);}
  .badge.idle{background:#fdf3d8;color:#b8860b;}
  .qr-print{display:inline-block;text-align:center;border:2px dashed #999;padding:14px;margin:6px;border-radius:10px;}
  .linkbtn{background:none;border:none;color:var(--navy);text-decoration:underline;font-weight:600;padding:0;margin:0;cursor:pointer;}
  /* ---- Smart Board finale ---- */
  #view-board.active{display:block;}
  .board-head{text-align:center;margin:6px 0 18px;}
  .board-head h1{font-size:clamp(24px,4vw,40px);margin:0;color:var(--gold);}
  .board-head p{margin:6px 0 0;color:#555;font-size:15px;}
  .board-cols{display:grid;grid-template-columns:2.2fr 1fr;gap:18px;align-items:start;}
  @media (max-width:720px){.board-cols{grid-template-columns:1fr;}}
  .chest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;}
  .chest-card{background:#fff;border:2px solid #eee;border-radius:14px;padding:10px 8px 12px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.06);transition:transform .12s;}
  /* Chest visual: a single sprite-sheet (40 frames, 8x5). Percentage background
     -position selects a frame independent of pixel size. Frame 0 = closed chest,
     last frame (100% 100%) = fully open. */
  .chest-vis{position:relative;width:88%;max-width:150px;margin:0 auto 6px;aspect-ratio:240/213;
    background-image:url(assets/chest/chest_sheet.png?v=1);background-size:800% 500%;
    background-position:0% 0%;background-repeat:no-repeat;}
  .chest-vis.opened{background-position:100% 100%;}
  /* per-keyhole glow, positioned at the 6 keyholes (2 rows x 3) */
  .kh{position:absolute;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
    pointer-events:none;opacity:0;transition:opacity .3s;
    background:radial-gradient(circle,rgba(255,248,214,.98) 0%,rgba(255,203,74,.7) 38%,rgba(255,180,40,0) 70%);}
  .kh.lit{opacity:1;animation:khGlow 1.3s ease-in-out infinite;}
  @keyframes khGlow{0%,100%{transform:translate(-50%,-50%) scale(.82);filter:brightness(1);}50%{transform:translate(-50%,-50%) scale(1.18);filter:brightness(1.4);}}
  .chest-card .c-grp{font-weight:800;color:var(--navy);margin-top:2px;font-size:15px;}
  .chest-card .c-sub{font-size:12px;color:#888;margin-top:2px;}
  .chest-card .c-score{font-weight:800;color:var(--gold);font-size:18px;margin-top:2px;}
  .chest-card.locked{opacity:.9;cursor:pointer;}
  .chest-card.ready{border-color:var(--gold);background:#fffaf0;cursor:pointer;animation:chestPulse 1.1s infinite;}
  .chest-card.ready:hover{transform:scale(1.05);}
  .chest-card.won{border-color:var(--green);background:#eafaf0;}
  @keyframes chestPulse{50%{box-shadow:0 0 0 4px rgba(212,169,78,.35);}}
  .chest-anim{position:fixed;z-index:60;pointer-events:none;}
  .rank-panel{background:var(--navy);color:#fff;border-radius:14px;padding:16px 16px 8px;position:sticky;top:12px;}
  .rank-panel h2{margin:0 0 10px;color:var(--gold);font-size:18px;text-align:center;}
  .rank-row{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid #ffffff22;}
  .rank-row:last-child{border-bottom:none;}
  .rank-pos{font-size:18px;min-width:30px;text-align:center;font-weight:800;}
  .rank-name{flex:1;font-weight:700;font-size:14px;}
  .rank-score{font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;}
  .board-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:14px 22px;border-radius:12px;font-weight:700;font-size:16px;box-shadow:0 8px 30px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;z-index:50;max-width:90vw;text-align:center;}
</style>
</head>
<body>

<div class="topbar">
  <h1 id="topTitle">🎯 Game Station Matematik</h1>
  <div id="timer" style="display:none;">--:--</div>
</div>
<div class="wrap">

  <!-- LOGIN / ROLE SELECT -->
  <div class="view" id="view-login">
    <div class="card">
      <h2>Log Masuk</h2>
      <button class="role-btn" onclick="showAdminLogin()">⚙️ Admin / Guru</button>
      <label>Atau pilih Kumpulan</label>
      <select id="groupLoginSelect"></select>
      <label>Password Kumpulan</label>
      <input id="groupLoginPass" placeholder="Masukkan password kumpulan anda">
      <button class="big" onclick="loginAsGroup()">Masuk sebagai Kumpulan</button>
      <div id="groupLoginMsg"></div>
    </div>
    <div class="card" id="adminLoginCard" style="display:none;">
      <label>PIN Admin</label>
      <input id="adminPin" type="password" placeholder="Masukkan PIN">
      <button onclick="loginAsAdmin()">Masuk Admin</button>
      <div id="adminLoginMsg"></div>
    </div>
  </div>

  <!-- ADMIN VIEW -->
  <div class="view" id="view-admin">
    <div class="card">
      <button class="linkbtn" onclick="logout()">← Log keluar</button>
      <h2>⚙️ Setup Stesen (6)</h2>
      <div id="stationsArea"></div>
      <button class="secondary" onclick="pushConfig()">🚀 Push Config & Reset Progress</button>
      <button onclick="generateQRs()">🖨️ Generate QR Tersembunyi</button>
      <button onclick="showLoginPasswords()">🔑 Papar Password Login Kumpulan</button>
      <button onclick="showSmartBoard()">🏴‍☠️ Buka Smart Board (Peti Harta)</button>
      <div id="pushStatus"></div>
      <div id="loginPassArea"></div>
    </div>
    <div class="card" id="printArea">
      <h3>QR Tersembunyi — Print & Sorok di Lokasi</h3>
      <div id="qrOutput"></div>
    </div>
    <div class="card">
      <h2>📊 Dashboard Live (14 Kumpulan)</h2>
      <table id="dashTable"><thead><tr><th>Kump</th><th>Status</th><th>Stesen</th><th>Selesai</th><th>Kunci</th><th>Markah</th></tr></thead><tbody id="dashRows"></tbody></table>
    </div>
  </div>

  <!-- GROUP: CLUE / SCAN VIEW -->
  <div class="view" id="view-clue">
    <div class="card">
      <button class="linkbtn" onclick="logout()">← Log keluar</button>
      <h2 id="clueGroupName"></h2>
      <div class="keyrow" id="keyrowMini"></div>
      <div class="clue" id="clueText"></div>
      <button class="big" onclick="openScanner()">📷 Scan QR Tersembunyi</button>
      <div id="reader" style="display:none;"></div>
      <div id="scanResultArea" style="display:none;">
        <label>Password (semak & sahkan)</label>
        <input id="passInput">
        <button class="big secondary" onclick="checkPassword()">✅ Sahkan Password</button>
      </div>
      <div id="passMsg"></div>
    </div>
  </div>

  <!-- GROUP: GAME VIEW -->
  <div class="view" id="view-game">
    <div class="card" id="gameCard"></div>
  </div>

  <!-- GROUP: STATION RESULT -->
  <div class="view" id="view-result">
    <div class="card" id="resultCard"></div>
  </div>

  <!-- GROUP: TREASURE CHEST FINALE (phone) -->
  <div class="view" id="view-chest">
    <div class="card finalbox" id="chestCard"></div>
  </div>

  <!-- SMART BOARD FINALE (big screen at the start point) -->
  <div class="view" id="view-board">
    <div id="boardWrap"></div>
  </div>

</div>

<script>
const GAME_TYPES = [
  {id:'quiz', name:'Quiz Pantas'},
  {id:'susun_nombor', name:'Susun Nombor'},
  {id:'padan', name:'Padan Jawapan'},
  {id:'pilihan', name:'Pilihan Bergambar'},
  {id:'grid_nombor', name:'Grid Nombor'},
  {id:'puzzle_susun', name:'Puzzle Cantum Nombor'},
  {id:'tangram', name:'Tangram Challenge'}
];
const NUM_GROUPS = 14;
const ADMIN_PIN = '1234';
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBSWbXoKgQt1E8xvJa9zaKyw3e9V_EMxAE",
  authDomain: "sk-sri-aman-database.firebaseapp.com",
  databaseURL: "https://sk-sri-aman-database-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sk-sri-aman-database",
  storageBucket: "sk-sri-aman-database.firebasestorage.app",
  messagingSenderId: "810640165554",
  appId: "1:810640165554:web:b3ad2dc6f1583ec2a657ab"
};
const PATH = 'gamestation2026';
let db, stations, groups, currentGroupId, progress={}, timerInterval, timeLeftSec, timeUp=false, gameState={}, html5QrCode;

function show(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// Bonus marks for the order in which a group opens its chest at the Smart Board
// (running back to finish first is rewarded). Index 0 = the 1st group to open.
const CHEST_BONUS = [50,40,30,25,20,15,12,10,8,6,5,4,3,2];

// Direct-play link: index.html?tangram (or ?demo=tangram) launches the Tangram
// Challenge straight away, no login — for sharing with other teachers/devs.
function isTangramDemo(){
  const q = new URLSearchParams(location.search);
  return q.has('tangram') || q.get('demo')==='tangram';
}
// index.html?board opens the big-screen Smart Board finale (for the projector).
function isSmartBoard(){
  const q = new URLSearchParams(location.search);
  return q.has('board') || q.get('view')==='board';
}
// ---------- FIREBASE SETUP (auto-connect, hardcoded) ----------
function connectFirebase(){
  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    initApp();
  }catch(e){
    // The tangram demo needs no Firebase, so still launch it on connection error.
    if(isTangramDemo()){ startTangramDemo(); return; }
    document.body.innerHTML = '<div class="wrap"><div class="card"><h2>❌ Ralat Sambungan Firebase</h2><p>'+e.message+'</p></div></div>';
  }
}

function initApp(){
  const sel = document.getElementById('groupLoginSelect');
  sel.innerHTML='';
  for(let i=1;i<=NUM_GROUPS;i++) sel.innerHTML += `<option value="${i}">Kumpulan ${i}</option>`;
  if(isTangramDemo()){ startTangramDemo(); return; }
  if(isSmartBoard()){ loadConfigCache().then(()=>showSmartBoard()); return; }
  loadConfigCache().then(()=>tryRestoreSession());
}

// Launch the tangram station directly in demo mode (test mode = no Firebase writes).
function startTangramDemo(){
  window._testMode = true; window._demoMode = true;
  document.getElementById('topTitle').innerText = '🧩 Tangram Challenge';
  startGame('demo', { name:'Tangram Challenge', gameType:'tangram', timeLimitMin:10 });
}

const SESSION_DURATION_MS = 12*60*60*1000; // 12 hours

function saveSession(role, gid){
  localStorage.setItem('gs_session', JSON.stringify({role, groupId:gid||null, ts:Date.now()}));
}
function clearSession(){
  localStorage.removeItem('gs_session');
}
function tryRestoreSession(){
  const raw = localStorage.getItem('gs_session');
  if(!raw){ show('view-login'); return; }
  let session;
  try{ session = JSON.parse(raw); }catch(e){ show('view-login'); return; }
  const age = Date.now() - (session.ts||0);
  if(age > SESSION_DURATION_MS){
    clearSession();
    show('view-login');
    return;
  }
  if(session.role==='admin'){
    show('view-admin');
    document.getElementById('topTitle').innerText='⚙️ Admin Panel';
    watchDashboard();
  } else if(session.role==='group' && session.groupId && groups[session.groupId]){
    currentGroupId = session.groupId;
    document.getElementById('topTitle').innerText='Kumpulan '+currentGroupId;
    loadGroupProgress();
  } else {
    clearSession();
    show('view-login');
  }
}

function loadConfigCache(){
  return db.ref(PATH+'/config').once('value').then(snap=>{
    const cfg = snap.val()||{};
    stations = cfg.stations || {};
    groups = cfg.groups || {};
    buildStationsUI(stations);
  });
}

// ---------- LOGIN ----------
function showAdminLogin(){ document.getElementById('adminLoginCard').style.display='block'; }
function loginAsAdmin(){
  if(document.getElementById('adminPin').value === ADMIN_PIN){
    saveSession('admin');
    show('view-admin');
    document.getElementById('topTitle').innerText='⚙️ Admin Panel';
    watchDashboard();
  } else {
    document.getElementById('adminLoginMsg').innerHTML='<div class="msg err">PIN salah</div>';
  }
}
function loginAsGroup(){
  const gid = document.getElementById('groupLoginSelect').value;
  const inputPass = document.getElementById('groupLoginPass').value.trim().toUpperCase();
  const g = groups[gid];
  const msg = document.getElementById('groupLoginMsg');
  if(!g || !g.loginPassword){
    msg.innerHTML='<div class="msg err">Config kumpulan belum di-push oleh admin.</div>';
    return;
  }
  if(inputPass !== String(g.loginPassword).toUpperCase()){
    msg.innerHTML='<div class="msg err">❌ Password kumpulan salah.</div>';
    return;
  }
  msg.innerHTML='';
  currentGroupId = gid;
  saveSession('group', gid);
  document.getElementById('topTitle').innerText='Kumpulan '+currentGroupId;
  loadGroupProgress();
}
function logout(){
  if(timerInterval) clearInterval(timerInterval);
  if(html5QrCode){ html5QrCode.stop().catch(()=>{}); }
  clearSession();
  document.getElementById('topTitle').innerText='🎯 Game Station Matematik';
  document.getElementById('timer').style.display='none';
  show('view-login');
}

// ---------- ADMIN: STATION CONFIG ----------
function buildStationsUI(existing){
  const area = document.getElementById('stationsArea');
  area.innerHTML='';
  for(let i=1;i<=6;i++){
    const s = existing[i] || {};
    const opts = GAME_TYPES.map(g=>`<option value="${g.id}" ${s.gameType===g.id?'selected':''}>${g.name}</option>`).join('');
    area.innerHTML += `
    <div class="station-block">
      <h3>Stesen ${i}</h3>
      <label>Nama Stesen</label><input id="st_name_${i}" value="${s.name||''}" placeholder="cth: Stesen Sifir">
      <label>Lokasi (teks clue)</label><input id="st_loc_${i}" value="${s.location||''}" placeholder="cth: Tempat membaca buku">
      <label>Password QR (sama untuk semua kumpulan)</label><input id="st_pass_${i}" value="${s.password||('PASS'+i+Math.floor(Math.random()*900+100))}">
      <label>Jenis Game</label><select id="st_gametype_${i}">${opts}</select>
      <label>Data Game (JSON)</label><input id="st_gamedata_${i}" value='${(s.gameDataRaw||"{}").replace(/'/g,"&apos;")}'>
      <button class="secondary" onclick="testStation(${i})">▶️ Uji Cara Main Stesen Ini</button>
    </div>`;
  }
}
function collectStations(){
  const out={};
  for(let i=1;i<=6;i++){
    out[i]={id:i,
      name:document.getElementById('st_name_'+i).value,
      location:document.getElementById('st_loc_'+i).value,
      password:document.getElementById('st_pass_'+i).value,
      timeLimitMin:10,
      gameType:document.getElementById('st_gametype_'+i).value,
      gameDataRaw:document.getElementById('st_gamedata_'+i).value};
  }
  return out;
}
// rotation: group i starts at station ((i-1)%6)+1, so groups 1,7,13 share start=1; 2,8,14 share start=2 etc (2 groups per station approx, since 14 groups /6)
function rotationFor(startStation){
  const order=[];
  for(let k=0;k<6;k++) order.push(((startStation-1+k)%6)+1);
  return order;
}
function randomLoginPassword(gid){
  const rand = Math.floor(1000+Math.random()*9000);
  return 'K'+gid+'-'+rand;
}
function collectGroups(){
  const out={};
  for(let i=1;i<=NUM_GROUPS;i++){
    const start = ((i-1)%6)+1;
    // preserve existing login password if already assigned, so re-pushing config mid-event doesn't lock groups out
    const existingPass = (groups && groups[i] && groups[i].loginPassword) ? groups[i].loginPassword : randomLoginPassword(i);
    out[i]={id:i, name:'Kumpulan '+i, order:rotationFor(start), loginPassword:existingPass};
  }
  return out;
}
function pushConfig(){
  const st = collectStations();
  const gr = collectGroups();
  const prog={};
  Object.keys(gr).forEach(gid=>{ prog[gid]={currentIndex:0,status:'idle',completedStations:{},keys:[],totalScore:0}; });
  db.ref(PATH+'/config/stations').set(st);
  db.ref(PATH+'/config/groups').set(gr);
  db.ref(PATH+'/progress').set(prog).then(()=>{
    stations=st; groups=gr;
    let listHtml = '<h4>Password Login Kumpulan (beri kepada setiap kumpulan)</h4><table><tr><th>Kumpulan</th><th>Password</th></tr>';
    Object.values(gr).forEach(g=>{ listHtml += `<tr><td>${g.name}</td><td><b>${g.loginPassword}</b></td></tr>`; });
    listHtml += '</table>';
    document.getElementById('pushStatus').innerHTML='<div class="msg ok">✅ Config di-push. 14 kumpulan sedia.</div>'+listHtml;
  });
}
function showLoginPasswords(){
  if(!groups || !Object.keys(groups).length){ alert('Tiada config kumpulan lagi. Push config dulu.'); return; }
  let html = '<h4>Password Login Kumpulan</h4><table><tr><th>Kumpulan</th><th>Password</th></tr>';
  Object.values(groups).forEach(g=>{ html += `<tr><td>${g.name}</td><td><b>${g.loginPassword||'-'}</b></td></tr>`; });
  html += '</table>';
  document.getElementById('loginPassArea').innerHTML = html;
}
function generateQRs(){
  const st = collectStations();
  stations = st;
  const out = document.getElementById('qrOutput');
  out.innerHTML='';
  Object.values(st).forEach(s=>{
    const div=document.createElement('div');
    div.className='qr-print';
    div.innerHTML=`<div style="font-weight:700;">Stesen ${s.id}: ${s.name}</div><div id="qr_${s.id}"></div><div style="font-size:11px;color:#888;">Sorok di: ${s.location}</div>`;
    out.appendChild(div);
    setTimeout(()=>new QRCode(document.getElementById('qr_'+s.id), {text:s.password, width:130, height:130}), 0);
  });
}
function watchDashboard(){
  db.ref(PATH+'/progress').on('value', snap=>{
    const prog = snap.val()||{};
    const rows = document.getElementById('dashRows');
    rows.innerHTML='';
    Object.keys(groups).forEach(gid=>{
      const g = groups[gid];
      const p = prog[gid]||{currentIndex:0,keys:[],totalScore:0,status:'idle'};
      const curSt = p.status==='won' ? '🏆 Menang' : p.status==='done' ? '📦 Peti Harta' : (stations[g.order[p.currentIndex]]?.name || '-');
      rows.innerHTML += `<tr><td>${gid}</td><td><span class="badge ${p.status==='idle'?'idle':'done'}">${p.status}</span></td><td>${curSt}</td><td>${p.currentIndex||0}/6</td><td>${'🔑'.repeat((p.keys||[]).length)}</td><td>${p.totalScore||0}</td></tr>`;
    });
  });
}

function openScanner(){

function onScan(decodedText){

function checkPassword(){

// ---------- GAME ----------
function startGame(stId, testSt){
  show('view-game');
  const st = testSt || stations[stId];
  timeUp=false;
  window._gameOver=false;
  timeLeftSec = (st.timeLimitMin||10)*60;
  window._startedAt = Date.now();
  window._curStId = stId;
  renderGame(st);
  // Tangram runs its own flow: instructions -> Mula -> timer -> 2 shapes, and
  // draws its own test banner, so don't start the timer / banner here for it.
  if(st.gameType==='tangram') return;
  document.getElementById('timer').style.display='block';
  timerInterval = setInterval(tick,1000);
  if(window._testMode){
    const card = document.getElementById('gameCard');
    const banner = document.createElement('div');
    banner.className='msg';
    banner.style.background='#fdf3d8';
    banner.style.marginTop='0';
    banner.innerHTML='🧪 <b>Mod Ujian</b> — markah tidak disimpan. <button class="linkbtn" onclick="endTest()">← Kembali ke Admin</button>';
    card.insertBefore(banner, card.firstChild);
  }
}
function tick(){
  timeLeftSec--;
  const m=Math.floor(timeLeftSec/60), s=timeLeftSec%60;
  const t=document.getElementById('timer');
  t.innerText=`${m}:${String(s).padStart(2,'0')}`;
  if(timeLeftSec<=30) t.classList.add('warn');
  if(timeLeftSec<=0){
    clearInterval(timerInterval); timeUp=true; t.innerText='HABIS';
    // Open-ended games (tangram) have no manual submit button, so auto-finish
    // on timeout — otherwise a student who can't solve is stranded here.
    if(gameState && gameState.type==='tangram' && window._tgTimeout){ window._tgTimeout(); }
  }
}
function renderGame(st){
  const card = document.getElementById('gameCard');
  let data={}; try{ data=JSON.parse(st.gameDataRaw||'{}'); }catch(e){ data={}; }
  gameState={type:st.gameType, correct:0, total:0, matched:0, selectedQ:null};

  if(st.gameType==='quiz' || st.gameType==='pilihan'){
    const qs = data.questions || [{q:'5 + 3',a:'8',choices:['7','8','9']}];
    gameState.total=qs.length; gameState.answers=new Array(qs.length).fill(null); gameState.qs=qs;
    let html=`<h2>${st.name}</h2>`;
    qs.forEach((q,i)=>{
      if(st.gameType==='pilihan' && q.choices){
        html+=`<div class="qitem"><b>${i+1}. ${q.q}</b><div id="choices_${i}">`;
        q.choices.forEach(c=>{ html+=`<button onclick="pickChoice(${i},'${c}')" style="margin:4px;">${c}</button>`; });
        html+=`</div></div>`;
      } else {
        html+=`<div class="qitem"><b>${i+1}. ${q.q}</b><input id="ans_${i}" placeholder="Jawapan"></div>`;
      }
    });
    html+=`<button class="big" onclick="finishGame()">Hantar Semua Jawapan</button>`;
    card.innerHTML=html;
  }
  else if(st.gameType==='susun_nombor'){
    const nums = data.numbers || [5,2,8,1,9,3];
    gameState.correctOrder=[...nums].sort((a,b)=>a-b); gameState.total=1; gameState.picked=[];
    let html=`<h2>${st.name}</h2><p>Klik nombor mengikut turutan menaik.</p><div id="chipArea">`;
    nums.forEach(n=>{ html+=`<span class="chip" onclick="pickNum(this,${n})">${n}</span>`; });
    html+=`</div><div style="margin-top:14px;">Jawapan: <span id="orderResult" style="font-weight:800;"></span></div><button class="big" onclick="checkOrder()">Semak Turutan</button>`;
    card.innerHTML=html;
  }
  else if(st.gameType==='padan' || st.gameType==='puzzle_susun'){
    const pairs = data.pairs || [{q:'5+5',a:'10'},{q:'3x3',a:'9'},{q:'10-4',a:'6'}];
    gameState.pairs=pairs; gameState.total=pairs.length;
    const answers=[...pairs.map(p=>p.a)].sort(()=>Math.random()-.5);
    let html=`<h2>${st.name}</h2><p>Padankan soalan dengan jawapan.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div><b>Soalan</b>`;
    pairs.forEach((p,i)=>{ html+=`<button class="match-btn" onclick="selectQ(${i})">${p.q}</button>`; });
    html+=`</div><div><b>Jawapan</b>`;
    answers.forEach(a=>{ html+=`<button class="match-btn" onclick="selectA('${a}',this)">${a}</button>`; });
    html+=`</div></div><div id="matchMsg"></div>`;
    card.innerHTML=html;
  }
  else if(st.gameType==='grid_nombor'){
    const size=data.size||3;
    const grid=data.grid || [[1,2,null],[null,5,6],[7,null,9]];
    gameState.grid=grid; gameState.total=1; gameState.solution=data.solution||grid;
    let html=`<h2>${st.name}</h2><p>Isi ruang kosong.</p><div class="grid3" style="grid-template-columns:repeat(${size},60px);">`;
    grid.forEach((row,r)=>row.forEach((cell,c)=>{
      html += cell===null ? `<input id="cell_${r}_${c}">` : `<div class="key" style="background:#eee;color:#333;">${cell}</div>`;
    }));
    html+=`</div><button class="big" onclick="checkGrid()">Semak Grid</button>`;
    card.innerHTML=html;
  }
  else if(st.gameType==='tangram'){
    startTangram(st);
    return;
  }
  else {
    card.innerHTML=`<h2>${st.name}</h2><p>Game belum dikonfigurasi.</p><button class="big" onclick="finishGame(true)">Selesai</button>`;
  }
}
function pickChoice(i,c){
  gameState.answers[i]=c;
  document.querySelectorAll(`#choices_${i} button`).forEach(b=>b.style.background=b.innerText===c?'#d4a94e':'');
}
function pickNum(el,n){ gameState.picked.push(n); el.style.opacity=.3; el.onclick=null; document.getElementById('orderResult').innerText=gameState.picked.join(', '); }
function checkOrder(){ gameState.correct = JSON.stringify(gameState.picked)===JSON.stringify(gameState.correctOrder)?1:0; finishGame(); }
function selectQ(i){ gameState.selectedQ=i; document.querySelectorAll('.match-btn').forEach((b,idx)=>{ if(idx<gameState.pairs.length) b.classList.toggle('selected', idx===i); }); }
function selectA(a,el){
  if(gameState.selectedQ===null) return;
  const p = gameState.pairs[gameState.selectedQ];
  if(String(p.a)===String(a)){
    gameState.matched++;
    document.querySelectorAll('.match-btn')[gameState.selectedQ].classList.add('matched');
    el.classList.add('matched');
    if(gameState.matched===gameState.total){
      document.getElementById('matchMsg').innerHTML='<div class="msg ok">Semua padan!</div>';
      gameState.correct=gameState.total;
      setTimeout(()=>finishGame(),500);
    }
  } else { el.style.background='#fbe4e2'; setTimeout(()=>el.style.background='',400); }
  gameState.selectedQ=null;
}
function checkGrid(){
  let correct=0,total=0;
  gameState.grid.forEach((row,r)=>row.forEach((cell,c)=>{
    if(cell===null){ total++; const val=document.getElementById(`cell_${r}_${c}`).value.trim(); if(Number(val)===Number(gameState.solution[r][c])) correct++; }
  }));
  gameState.correct = correct===total?1:0; gameState.total=1;
  finishGame();
}
// Tangram station: every student builds THREE shapes in sequence (square, then
// horse, then cat), one shared timer, after a clear instructions screen. Marks
// out of 200: 40 per shape completed, plus a time bonus of (timeLeft/total)*80
// once all three are done. The admin "Uji" path runs this exact same flow.
const TG_STAGE_MARK = 40, TG_TIME_BONUS = 80;
function startTangram(st){
  const S = window.TangramShapes;
  gameState.type='tangram'; gameState.total=1; gameState.correct=0;
  const totalSec = (st.timeLimitMin||10)*60;
  const SHAPES = [
    {id:'kuda',      name:'Kuda',       guide:false},
    {id:'kucing',    name:'Kucing',     guide:false},
    {id:'segiempat', name:'Segi Empat', guide:false},
  ];
  let idx = 0;    // shape currently being built
  let done = 0;   // shapes completed so far
  const card = document.getElementById('gameCard');
  const testBanner = () => window._demoMode
    ? '<div class="msg" style="background:#e7f0ff;margin-top:0;">🎮 <b>Demo Tangram</b> — <button class="linkbtn" onclick="startTangramDemo()">↺ Main semula</button></div>'
    : window._testMode
    ? '<div class="msg" style="background:#fdf3d8;margin-top:0;">🧪 <b>Mod Ujian</b> — markah tidak disimpan. <button class="linkbtn" onclick="endTest()">← Kembali ke Admin</button></div>'
    : '';

  function showInstructions(){
    if(timerInterval) clearInterval(timerInterval);
    document.getElementById('timer').style.display='none';
    card.innerHTML = testBanner() + `
      <h2>🧩 ${st.name}</h2>
      <div class="card" style="text-align:left;box-shadow:none;border:2px solid #eee;">
        <h3 style="margin-top:0;">📋 Arahan</h3>
        <ol style="padding-left:20px;line-height:1.7;margin:0;">
          <li>Anda perlu bina <b>3 bentuk</b> mengikut urutan: <b>Kuda</b> → <b>Kucing</b> → <b>Segi Empat</b>.</li>
          <li>Bayang bentuk (kelabu) ada dalam kotak — <b>seret keping</b> ke dalam bayang; keping akan <b>melekat</b> ke tempatnya.</li>
          <li><b>Ketik</b> keping untuk pusing 45°. Bentuk siap secara <b>automatik</b> apabila lengkap.</li>
        </ol>
        <div class="msg ok" style="font-weight:700;margin-top:12px;">
          🏆 Markah penuh <b>200</b> · Setiap bentuk siap = <b>${TG_STAGE_MARK}</b> markah · Siap semua 3 = bonus masa sehingga <b>${TG_TIME_BONUS}</b> (makin cepat, makin tinggi).<br>
          ⏱️ Masa: <b>${Math.round(totalSec/60)} minit</b> — bermula bila anda tekan Mula.
        </div>
      </div>
      <button class="big" onclick="window._tgStart()">▶️ Mula Aktiviti</button>`;
  }

  function startActivity(){
    timeUp=false; window._gameOver=false;
    timeLeftSec = totalSec; window._startedAt = Date.now();
    document.getElementById('timer').style.display='block';
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(tick,1000);
    playShape();
  }

  function playShape(){
    const shp = SHAPES[idx];
    card.innerHTML = testBanner() + `
      <h2>🧩 ${st.name}</h2>
      <div style="font-weight:800;color:var(--gold);background:var(--navy);display:inline-block;padding:5px 14px;border-radius:6px;">Bentuk ${idx+1}/3: ${shp.name} · Markah: ${done*TG_STAGE_MARK}</div>
      <canvas id="tgBoard" width="360" height="460" style="background:#fff;border:3px solid #d4a94e;border-radius:12px;touch-action:none;max-width:100%;display:block;margin:10px auto;"></canvas>
      <p style="color:#555;font-size:13px;">Seret keping ke dalam bayang. Ketik keping = putar.</p>
      <button id="tgFlip" class="secondary" style="display:none;" onclick="window._tgCtrl && window._tgCtrl.flipSelected()">↔ Balik</button>`;
    window._tgCtrl = window.TangramUI.attachTangram(document.getElementById('tgBoard'), {
      solution: S.SOLUTIONS[shp.id], ppu: 51, targetGuideLines: shp.guide,
      onSolve: onShapeSolved,
      onSelect: (p) => { const f=document.getElementById('tgFlip'); if(f) f.style.display=(p&&p.type==='para')?'inline-block':'none'; }
    });
  }

  function onShapeSolved(){
    done++; idx++;
    if(idx < SHAPES.length){
      card.innerHTML = testBanner() + `<div class="finalbox">
        <div style="font-size:56px;">✅</div>
        <h2 style="color:var(--green);">Bentuk ${done}/3 Selesai! <span style="color:var(--gold);">+${TG_STAGE_MARK} markah</span></h2>
        <p>Markah setakat ini: <b>${done*TG_STAGE_MARK}</b>. Seterusnya: bina <b>${SHAPES[idx].name}</b>.</p>
        <p style="color:#888;font-size:13px;">⏱️ Masa masih berjalan — teruskan cepat untuk bonus masa!</p>
        <button class="big" onclick="window._tgNext()">➡️ Bina ${SHAPES[idx].name}</button>
      </div>`;
    } else {
      complete();
    }
  }

  function complete(){
    if(window._gameOver) return; window._gameOver=true;
    if(timerInterval) clearInterval(timerInterval);
    const remain = Math.max(0, timeLeftSec);
    const allDone = done >= SHAPES.length;
    const score = done*TG_STAGE_MARK + (allDone ? Math.round((remain/totalSec)*TG_TIME_BONUS) : 0);
    const timeTakenSec = Math.round((Date.now()-window._startedAt)/1000);
    if(window._testMode){ showTangramTestResult(done, SHAPES.length, score, timeTakenSec); return; }
    submitCompletion(allDone, score, timeTakenSec);
  }

  window._tgStart = startActivity;
  window._tgNext = playShape;
  window._tgTimeout = complete;   // invoked by tick() when the timer hits 0
  showInstructions();
}
function showTangramTestResult(done, total, score, timeTakenSec){
  show('view-result');
  document.getElementById('timer').style.display='none';
  const msg = done>=total ? `Semua ${total} bentuk siap! 🎉` : done>0 ? `${done}/${total} bentuk siap` : 'Tiada bentuk siap';
  document.getElementById('resultCard').innerHTML=`<div class="finalbox">
    <div style="font-size:50px;">🧪</div>
    <h2>Ujian Selesai</h2>
    <p>${msg}</p>
    <p>Markah: <b>${score}</b> / 200 <span style="color:#888;">(${timeTakenSec}s)</span></p>
    <p style="color:#888;font-size:13px;">${window._demoMode ? 'Demo — tiada markah disimpan.' : 'Mod ujian — tiada markah disimpan ke Firebase.'}</p>
    ${window._demoMode ? '<button class="big" onclick="startTangramDemo()">↺ Main Semula</button>' : '<button class="big" onclick="endTest()">← Kembali ke Admin</button>'}
  </div>`;
}
function finishGame(forceOk){
  if(window._gameOver) return;   // guard against double-completion (e.g. solve then timeout)
  window._gameOver=true;
  if(gameState.type==='quiz'||gameState.type==='pilihan'){
    let correct=0;
    gameState.qs.forEach((q,i)=>{
      const given = gameState.type==='pilihan'? gameState.answers[i] : (document.getElementById('ans_'+i)?.value||'').trim();
      if(String(given).toLowerCase()===String(q.a).toLowerCase()) correct++;
    });
    gameState.correct=correct;
  }
  if(forceOk){ gameState.correct=gameState.total=1; }
  clearInterval(timerInterval);
  const onTime = !timeUp;
  const timeTakenSec = Math.round((Date.now()-window._startedAt)/1000);
  const pct = gameState.total? gameState.correct/gameState.total : 1;
  let score = Math.round(pct*100);
  if(!onTime) score -= 20;
  if(score<0) score=0;
  if(window._testMode){ showTestResult(onTime, score, timeTakenSec); return; }
  submitCompletion(onTime, score, timeTakenSec);
}
function submitCompletion(onTime, score, timeTakenSec){
  const stId = window._curStId;
  const progRef = db.ref(PATH+'/progress/'+currentGroupId);
  progRef.once('value').then(snap=>{
    const p = snap.val();
    const newIndex = p.currentIndex+1;
    const keys = p.keys||[]; keys.push(stId);
    const completedStations = p.completedStations||{};
    completedStations[stId]={score, onTime, timeTakenSec, ts:Date.now()};
    const totalScore=(p.totalScore||0)+score;
    const done = newIndex>=6;
    progRef.update({currentIndex:newIndex, keys, completedStations, totalScore, status:done?'ready_chest':'idle'})
      .then(()=>{ progress={...p,currentIndex:newIndex,keys,completedStations,totalScore}; showResult(onTime,score,done); });
  });
}
function showResult(onTime, score, done){
  show('view-result');
  document.getElementById('timer').style.display='none';
  const g = groups[currentGroupId];
  let nextHtml='';
  if(done){ nextHtml=`<button class="big" onclick="showGoToBoard()">🏁 Selesai! Ke Peti Harta</button>`; }
  else { nextHtml=`<button class="big" onclick="showClueScreen()">➡️ Lihat Clue Seterusnya</button>`; }
  document.getElementById('resultCard').innerHTML=`<div class="finalbox">
    <div style="font-size:50px;">🔑</div>
    <h2>${onTime?'Tepat Masa!':'Masa Tamat — Markah Ditolak'}</h2>
    <p>Markah stesen ini: <b>${score}</b></p>
    ${nextHtml}
  </div>`;
}

// The 6 keyholes (2 rows x 3), as % of the chest sprite frame. Index 0..5 =
// key-collection order (top row left->right, then bottom row) so key N lights
// the first N keyholes.
const KEYHOLES = [[25.1,47.0],[49.9,46.9],[74.7,46.9],[25.1,67.9],[49.9,67.9],[74.8,67.9]];
const CHEST_ANIM = { N:40, COLS:8, ROWS:5, DUR:1700 };
const animatingGids = new Set();
function chestVis(litCount, opened){
  const holes = KEYHOLES.map((k,i)=>
    `<span class="kh${(i<litCount)?' lit':''}" style="left:${k[0]}%;top:${k[1]}%"></span>`).join('');
  return `<div class="chest-vis${opened?' opened':''}">${holes}</div>`;
}
function renderSmartBoard(grps, prog){
  const ids = Object.keys(grps).length ? Object.keys(grps) : Array.from({length:NUM_GROUPS},(_,i)=>String(i+1));
  const opened = ids.map(gid=>({gid, p:prog[gid]||{}}))
    .filter(x=>x.p.status==='won')
    .sort((a,b)=>(b.p.finalScore||0)-(a.p.finalScore||0));
  const rankOf={}; opened.forEach((x,i)=>rankOf[x.gid]=i+1);
  const medal=['🥇','🥈','🥉'];
  const rankHtml = opened.length
    ? opened.map((x,i)=>`<div class="rank-row"><span class="rank-pos">${medal[i]||('#'+(i+1))}</span><span class="rank-name">Kumpulan ${x.gid}</span><span class="rank-score">${x.p.finalScore}</span></div>`).join('')
    : '<p style="text-align:center;color:#ffffffaa;padding:14px;">Belum ada kumpulan buka peti…</p>';
  const chestsHtml = ids.map(gid=>{
    const p = prog[gid]||{currentIndex:0,keys:[],status:'idle'};
    const keys=Math.min((p.keys||[]).length, 6);
    const id=`chest-card-${gid}`;
    if(p.status==='won'){
      return `<div class="chest-card won" id="${id}">${chestVis(0,true)}<div class="c-grp">Kumpulan ${gid}</div><div class="c-score">${p.finalScore} mkh</div><div class="c-sub">#${rankOf[gid]} · buka ke-${p.finishOrder}</div></div>`;
    }
    if((p.currentIndex||0)>=6){
      return `<div class="chest-card ready" id="${id}" onclick="openChestOnBoard('${gid}')">${chestVis(6,false)}<div class="c-grp">Kumpulan ${gid}</div><div class="c-sub" style="color:var(--gold);font-weight:800;">SEDIA! Tekan</div></div>`;
    }
    return `<div class="chest-card locked" id="${id}" onclick="openChestOnBoard('${gid}')">${chestVis(keys,false)}<div class="c-grp">Kumpulan ${gid}</div><div class="c-sub">${keys}/6 kunci</div></div>`;
  }).join('');
  document.getElementById('boardWrap').innerHTML = `
    <div class="board-head">
      <h1>🏴‍☠️ Peti Harta Karun</h1>
      <p>Kumpulan yang sudah kumpul <b>6 kunci</b> — tekan peti kumpulan anda untuk buka!</p>
    </div>
    <div class="board-cols">
      <div class="chest-grid">${chestsHtml}</div>
      <div class="rank-panel"><h2>🏆 Ranking</h2>${rankHtml}</div>
    </div>`;
}
// Play the opening animation on a floating overlay above the tapped card, plus
// the chest sound. Runs independently of the grid so live DB re-renders under
// it don't interrupt. Calls done(removeOverlay) on the final (open) frame.
function playChestOpen(cardEl, done){
  const vis = cardEl && cardEl.querySelector('.chest-vis');
  if(!vis){ done && done(()=>{}); return; }
  const r = vis.getBoundingClientRect();
  const ov = document.createElement('div');
  ov.className = 'chest-vis chest-anim';
  ov.style.left=r.left+'px'; ov.style.top=r.top+'px';
  ov.style.width=r.width+'px'; ov.style.height=r.height+'px';
  ov.style.margin='0'; ov.style.maxWidth='none';
  document.body.appendChild(ov);
  try{ const au=new Audio('assets/chest/chest_open.mp3?v=1'); au.volume=1; au.play().catch(()=>{}); }catch(_){}
  const {N,COLS,ROWS,DUR}=CHEST_ANIM, t0=performance.now();
  (function step(t){
    const f=Math.min(N-1, Math.floor((t-t0)/DUR*N));
    ov.style.backgroundPosition=`${(f%COLS)/(COLS-1)*100}% ${Math.floor(f/COLS)/(ROWS-1)*100}%`;
    if(f<N-1) requestAnimationFrame(step);
    else done && done(()=>ov.remove());
  })(performance.now());
}
function openChestOnBoard(gid){
  if(animatingGids.has(gid)) return;
  db.ref(PATH+'/progress/'+gid).once('value').then(snap=>{
    const p = snap.val()||{};
    if(p.status==='won') return; // already opened
    if((p.currentIndex||0) < 6){
      flashBoardMsg(`🔒 Kumpulan ${gid} belum cukup kunci (${(p.keys||[]).length}/6) — belum boleh buka!`);
      return;
    }
    animatingGids.add(gid);
    const card = document.getElementById('chest-card-'+gid);
    playChestOpen(card, (removeOverlay)=>{
      db.ref(PATH+'/progress').once('value').then(all=>{
        const prog = all.val()||{};
        const order = Object.values(prog).filter(x=>x&&x.status==='won').length + 1;
        const bonus = CHEST_BONUS[Math.min(order-1, CHEST_BONUS.length-1)];
        const finalScore = (p.totalScore||0) + bonus;
        db.ref(PATH+'/progress/'+gid).update({status:'won', finishOrder:order, finishBonus:bonus, finalScore, openedAt:Date.now()})
          .then(()=>{ removeOverlay(); animatingGids.delete(gid); });
        flashBoardMsg(`🎉 Kumpulan ${gid} buka peti! +${bonus} bonus (buka ke-${order}) · Markah akhir ${finalScore}`);
      }).catch(()=>{ removeOverlay(); animatingGids.delete(gid); });
    });
  });
}
function flashBoardMsg(msg){
  let t = document.getElementById('boardToast');
  if(!t){ t=document.createElement('div'); t.id='boardToast'; t.className='board-toast'; document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity='1';
  clearTimeout(window._boardToastT); window._boardToastT = setTimeout(()=>{ t.style.opacity='0'; }, 3800);
}

window.onload=()=>{
  connectFirebase();
};
</script>
